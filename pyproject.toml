[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-printer-agent-local"
version = "0.1.0"
description = "Local-first CAD generation and evidence-aware 3D printing preparation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "UULAB"}]
keywords = ["3d-printing", "cadquery", "bambu-studio", "local-first"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "cadquery==2.7.0",
  "fastapi==0.141.1",
  "uvicorn==0.52.1",
  "pydantic==2.13.4",
  "httpx==0.28.1",
]

[project.scripts]
printer-agent = "print_agent.__main__:main"

[project.urls]
Homepage = "https://github.com/uulab-official/3d-printer-agent"
Source = "https://github.com/uulab-official/3d-printer-agent"
Issues = "https://github.com/uulab-official/3d-printer-agent/issues"

[tool.setuptools.packages.find]
include = ["print_agent*"]

[tool.setuptools.package-data]
print_agent = ["static/*.html", "static/*.css", "static/*.js"]
