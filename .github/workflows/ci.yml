name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: CAD, API, package, and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PPA_LLM_BASE_URL: ""
      PPA_LLM_MODEL: ""
      PPA_LLM_API_KEY: ""
      PPA_BAMBU_PATH: /nonexistent/bambu-studio
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install browser test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install --no-install-recommends -y libgl1 fonts-noto-cjk

      - name: Run CAD, configuration, and API tests
        run: python -m unittest discover -v

      - name: Check UI syntax and state transitions
        run: |
          node --check print_agent/static/app.js
          npm run test:state

      - name: Build and install the Python wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m pip install --no-deps dist/*.whl

      - name: Check the installed package outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -m print_agent doctor
          python - <<'PY'
          from pathlib import Path
          import print_agent
          static = Path(print_agent.__file__).parent / 'static'
          for name in ('index.html', 'style.css', 'app.js'):
              assert (static / name).is_file(), name
          print('Installed package includes its UI assets.')
          PY

      - name: Run real desktop and mobile browser workflows
        run: npm run test:browser

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence
          path: |
            qa-output/playwright/results/
            qa-output/playwright/report/
            qa-output/playwright/results.json
          retention-days: 7
          if-no-files-found: ignore
