name: Installed desktop package qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    name: Build the shared wheel and byte receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build one wheel for all desktop jobs
        run: python -m pip wheel --no-deps --wheel-dir wheelhouse .

      - name: Record exact wheel identity
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          wheels = list(Path('wheelhouse').glob('*.whl'))
          assert len(wheels) == 1, 'Expected exactly one application wheel'
          wheel = wheels[0]
          content = wheel.read_bytes()
          digest = hashlib.sha256(content).hexdigest()
          receipt = {'schema_version': 1, 'filename': wheel.name, 'bytes': len(content),
                     'sha256': digest, 'source_commit': os.environ['GITHUB_SHA']}
          (wheel.parent / 'wheel-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          (wheel.parent / 'SHA256SUMS').write_text(f'{digest}  {wheel.name}\n', encoding='utf-8')
          print(json.dumps(receipt))

      - name: Retain installable bytes and checksum
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installable-wheel-${{ github.sha }}
          path: wheelhouse/
          retention-days: 14
          if-no-files-found: warn

  qualify:
    name: Installed package on ${{ matrix.os }}
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PPA_LLM_BASE_URL: ""
      PPA_LLM_MODEL: ""
      PPA_LLM_API_KEY: ""
    steps:
      - name: Check out qualification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Retrieve the exact shared wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: installable-wheel-${{ github.sha }}
          path: ${{ runner.temp }}/qualified-wheel

      - name: Install Linux CAD runtime library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgl1

      - name: Verify receipt and install the wheel
        working-directory: ${{ runner.temp }}
        shell: python
        run: |
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'qualified-wheel'
          receipt = json.loads((root / 'wheel-receipt.json').read_text(encoding='utf-8'))
          wheels = list(root.glob('*.whl'))
          assert len(wheels) == 1 and wheels[0].name == receipt['filename']
          content = wheels[0].read_bytes()
          assert len(content) == receipt['bytes']
          assert hashlib.sha256(content).hexdigest() == receipt['sha256']
          assert receipt['source_commit'] == os.environ['GITHUB_SHA']
          subprocess.run([sys.executable, '-m', 'pip', 'install', str(wheels[0])], check=True)

      - name: Qualify installed CAD, HTTP, ownership, and restart recovery
        working-directory: ${{ runner.temp }}
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          wheel = next((root / 'qualified-wheel').glob('*.whl'))
          script = Path(os.environ['GITHUB_WORKSPACE']) / 'scripts' / 'qualify_install.py'
          subprocess.run([sys.executable, str(script), '--wheel', str(wheel),
                          '--receipt', str(root / 'qualified-wheel' / 'wheel-receipt.json'),
                          '--report-dir', str(root / 'package-evidence')], check=True)

      - name: Preserve a report if installation stopped before qualification
        if: always()
        working-directory: ${{ runner.temp }}
        shell: python
        run: |
          import hashlib, json, os, platform
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          reports = root / 'package-evidence'
          reports.mkdir(exist_ok=True)
          target = reports / 'report.json'
          if not target.exists():
              report = {'schema_version': 1, 'status': 'not_qualified', 'source_commit': os.environ['GITHUB_SHA'],
                        'platform': {'system': platform.system(), 'machine': platform.machine()},
                        'python': platform.python_version(), 'checks_passed': 0, 'checks_total': 0,
                        'detail': 'Installation or workflow setup stopped before the qualification script; inspect this job log.'}
              receipt = root / 'qualified-wheel' / 'wheel-receipt.json'
              if receipt.is_file():
                  content = receipt.read_bytes()
                  (reports / 'wheel-receipt.json').write_bytes(content)
                  report['wheel_receipt_sha256'] = hashlib.sha256(content).hexdigest()
              target.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')

      - name: Retain platform qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/package-evidence/
          retention-days: 14
          if-no-files-found: warn
