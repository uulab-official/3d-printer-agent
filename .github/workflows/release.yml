name: Promote qualified desktop release

on:
  workflow_run:
    workflows: [CI, Installed desktop package qualification, Native Bambu CLI qualification]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release-promotion-${{ github.repository }}
  cancel-in-progress: false

jobs:
  promote:
    name: Verify all gates and promote exact wheel bytes
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out trusted current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Verify qualification and publish the existing wheel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/promote_release.py
          --repository "$GITHUB_REPOSITORY"
          --event "$GITHUB_EVENT_PATH"
          --source-root "$GITHUB_WORKSPACE"
          --report-dir release-promotion

      - name: Preserve a result if setup stopped before promotion
        if: always()
        shell: python
        run: |
          import json, os
          from pathlib import Path
          root = Path('release-promotion')
          root.mkdir(exist_ok=True)
          target = root / 'report.json'
          if not target.exists():
              report = {'schema_version': 1, 'status': 'not_promoted',
                        'workflow_run_id': os.environ['GITHUB_RUN_ID'],
                        'reason': 'Workflow setup or promotion stopped before a report; inspect the job log.'}
              target.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')

      - name: Preserve promotion result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-promotion-${{ github.run_id }}
          path: release-promotion/report.json
          retention-days: 14
          if-no-files-found: warn
